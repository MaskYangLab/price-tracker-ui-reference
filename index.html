<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>價格追蹤 App｜UI 參考</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f7;
      --card: #ffffff;
      --ink: #263442;
      --muted: #68727d;
      --line: #d8dee6;
      --accent: #176da5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.55;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 2.25rem);
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    section {
      margin: 20px 0;
      padding: 20px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 2px 10px #0001;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .description {
      margin: 8px 0 0;
      color: var(--muted);
    }

    img {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .hint {
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid #c9dfef;
      border-radius: 12px;
      background: #f0f6fb;
      color: #34546b;
    }

    code {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      section {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>價格追蹤 App：UI 整合參考</h1>
    <p>此頁集中顯示目前開發中的畫面與先前 UI 設計，供後續整合比對。</p>
  </header>

  <section>
    <h2>希望採用的 UI 設計</h2>
    <p class="description">先前設計的整體視覺、資訊層級與版面風格參考。</p>
    <img
      src="0035B834D302DD14DF321F0669254942F81E9686.jpg"
      alt="先前設計的價格追蹤 App UI 參考圖">
  </section>

  <section>
    <h2>目前開發中的介面 1</h2>
    <p class="description">價格紀錄 App 的開發中畫面。</p>
    <img
      src="Step 13.9.6.5.png"
      alt="我的價格紀錄 Step 13.9.6.5 開發中介面 1">
  </section>

  <section>
    <h2>目前開發中的介面 2</h2>
    <p class="description">價格紀錄 App 的開發中畫面。</p>
    <img
      src="Step 13.9.6.5 (1).png"
      alt="我的價格紀錄 Step 13.9.6.5 開發中介面 2">
  </section>

  <section>
    <h2>目前開發中的介面 3</h2>
    <p class="description">價格紀錄 App 的開發中畫面。</p>
    <img
      src="Step 13.9.6.5 (2).png"
      alt="我的價格紀錄 Step 13.9.6.5 開發中介面 3">
  </section>

  <p class="hint">
    圖片與 <code>index.html</code> 必須放在 repository 的同一個根目錄；GitHub Pages 發布後可用於檢視與討論 UI 整合方向。
  </p>
</body>
</html>
